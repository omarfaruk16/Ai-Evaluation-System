# /etc/nginx/sites-available/ai-marking — TLS in front of the API on 127.0.0.1:4200.
# Get a certificate first: certbot certonly --nginx -d ai.example.edu

server {
    listen 80;
    server_name ai.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.example.edu;

    ssl_certificate     /etc/letsencrypt/live/ai.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.edu/privkey.pem;

    client_max_body_size 12m;      # 500 answers per request
    proxy_read_timeout 90s;        # rubric drafts are synchronous

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Client API: only the projects that use this service need to reach it. List their server IPs.
    location /v1/ {
        # allow 203.0.113.10;   # e-Exam API server
        # deny all;
        proxy_pass http://127.0.0.1:4200;
    }

    # Operator console and its API: limit to your own IPs (office, home, VPN) if you can.
    location ~ ^/(console|admin-api)(/|$) {
        # allow 198.51.100.7;   # your office
        # deny all;
        proxy_pass http://127.0.0.1:4200;
    }

    location / {
        proxy_pass http://127.0.0.1:4200;
    }
}
